[build-system]
requires = ["setuptools>=77.0"]  # >=77: SPDX license expressions (PEP 639)
build-backend = "setuptools.build_meta"

[project]
name = "cairndb"
version = "0.4.0"
description = "Serverless database engine on blob storage: commit logs, coordination primitives, multi-key transactions, and SQLite projections — no servers anywhere"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "CairnDB Contributors"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    # Serialization
    "msgpack>=1.0.0",

    # Client/Database
    "sqlalchemy[asyncio]>=2.0.25",
    "aiosqlite>=0.19.0",

    # Utilities
    "structlog>=24.1.0",
]

[project.urls]
Documentation = "https://quadratic-labs.github.io/cairndb/"
Repository = "https://github.com/Quadratic-Labs/cairndb"
Changelog = "https://github.com/Quadratic-Labs/cairndb/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Storage backends (filesystem needs no extra)
s3 = ["boto3>=1.35.0"]  # >=1.35 for IfNoneMatch conditional writes
gcs = ["google-cloud-storage>=2.14.0"]
azure = [
    "azure-storage-blob>=12.19.0",
    "azure-identity>=1.16.0",
]

cli = [
    "typer>=0.9.0",
]

docs = [
    "sphinx>=8.0",
    "myst-parser>=4.0",
    "furo>=2024.8.6",
    "sphinx-copybutton>=0.5.2",
    "sphinxcontrib-mermaid>=1.0",
    "sphinx-autobuild>=2024.10.3",
    "typer>=0.9.0",  # the CLI reference imports cairndb.cli
]

dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.98.0",
    "mutmut>=3.7.0",
    "black>=24.1.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
    "boto3>=1.35.0",
    "google-cloud-storage>=2.14.0",
    "azure-storage-blob>=12.19.0",
    "azure-identity>=1.16.0",
    "typer>=0.9.0",
]

[project.scripts]
cairndb = "cairndb.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cairndb = ["py.typed"]  # PEP 561: ship the inline type hints

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "azure_live: hits a real Azure Blob container (opt-in: CAIRNDB_AZURE_INTEGRATION=1)",
]

[tool.mutmut]
source_paths = ["src/cairndb/"]
pytest_add_cli_args_test_selection = ["tests/"]
do_not_mutate = [
    # Demo entry point and its handlers: not correctness surface — mutating
    # ping payloads / tick intervals would only calcify the demo. A smoke
    # test (test_client_run.py) guards that `make demo` still works.
    "*/cairndb/client/run.py",
    "*/cairndb/client/demo_handlers.py",
]
do_not_mutate_patterns = [
    # disable mutations of all logger.info/debug/... statements
    'logger\.\w+',
    # disable mutating exceptions
    'raise \w+',
]

[tool.black]
line-length = 100
target-version = ["py314"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint.per-file-ignores]
# Tests may use blocking file I/O inside async test functions.
"tests/**" = ["ASYNC230"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
