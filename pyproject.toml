[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cairndb"
version = "0.4.0"
description = "Event-sourced, serverless database on blob storage with SQLite projections"
readme = "README.md"
requires-python = ">=3.14"
license = {text = "MIT"}
authors = [
    {name = "CairnDB Contributors"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    # Serialization
    "msgpack>=1.0.0",

    # Configuration
    "pydantic>=2.6.0",

    # Client/Database
    "sqlalchemy[asyncio]>=2.0.25",
    "aiosqlite>=0.19.0",

    # Utilities
    "structlog>=24.1.0",
]

[project.optional-dependencies]
# Storage backends (filesystem needs no extra)
s3 = ["boto3>=1.35.0"]  # >=1.35 for IfNoneMatch conditional writes
gcs = ["google-cloud-storage>=2.14.0"]
azure = [
    "azure-storage-blob>=12.19.0",
    "azure-identity>=1.16.0",
]

cli = [
    "typer>=0.9.0",
]

dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.98.0",
    "black>=24.1.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
    "boto3>=1.35.0",
    "google-cloud-storage>=2.14.0",
    "azure-storage-blob>=12.19.0",
    "azure-identity>=1.16.0",
    "typer>=0.9.0",
]

[project.scripts]
cairndb = "cairndb.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.black]
line-length = 100
target-version = ["py314"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
