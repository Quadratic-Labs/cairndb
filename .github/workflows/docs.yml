# Build the Sphinx documentation, and publish it to GitHub Pages from the
# latest release branch.
#
# - Pull requests: build only (warnings fail), as a check.
# - Push to release/X.Y: build, then deploy only if X.Y is the highest
#   release branch on the remote. Pushes to older release branches
#   (backports) are built but never overwrite the published site.
# - Manual runs (workflow_dispatch) follow the same rule for the chosen branch.
name: Docs

on:
  push:
    branches: ["release/**"]
  pull_request:
    branches: [main, "release/**"]
    paths:
      - "docs/**"
      - "src/**"
      - "pyproject.toml"
      - "CHANGELOG.md"
      - "CODE_OF_CONDUCT.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.latest.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[docs]"

      - name: Build
        run: make docs

      - name: Is this the latest release branch?
        id: latest
        if: github.event_name != 'pull_request'
        run: |
          latest=$(git ls-remote --heads origin 'release/*' \
            | sed -n 's|.*refs/heads/\(release/[0-9][0-9]*\(\.[0-9][0-9]*\)*\)$|\1|p' \
            | sort -V | tail -n 1)
          echo "Latest release branch: ${latest:-<none>}; this run: $GITHUB_REF_NAME"
          if [ -n "$latest" ] && [ "$GITHUB_REF_NAME" = "$latest" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Not the latest release branch ($latest): docs built, not published."
          fi

      - uses: actions/upload-pages-artifact@v5
        if: steps.latest.outputs.deploy == 'true'
        with:
          path: docs/_build/html

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
